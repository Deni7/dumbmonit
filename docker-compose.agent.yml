# The DumbMonit agent as a container.
#
#   DUMBMONIT_AGENT_URL=https://monitor.example.org DUMBMONIT_AGENT_TOKEN=dmon_… \
#   docker compose -f docker-compose.agent.yml up -d
#
# An ordinary agent is outbound only: nothing to open on this side. A relay
# (DUMBMONIT_AGENT_RELAY=true, or a relay token) also opens a gateway on port
# 8443 for the agents of its site: see ports: below. Options and trade-offs
# (host network, relay mode, private CA): docs/devices/agent.md and
# docs/install/remote-site.md.
name: dumbmonit-agent

services:
  agent:
    image: ghcr.io/selfhostr/dumbmonit-agent:latest
    environment:
      DUMBMONIT_AGENT_URL: ${DUMBMONIT_AGENT_URL:?set the server URL}
      DUMBMONIT_AGENT_TOKEN: ${DUMBMONIT_AGENT_TOKEN:?copy the token shown when adding a server with the agent}
      # Encrypted agent channel and the fingerprint of the server's authority,
      # as the install command shows them. Behind a relay, the relay's gateway.
      DUMBMONIT_AGENT_TLS_URL: ${DUMBMONIT_AGENT_TLS_URL:-}
      DUMBMONIT_AGENT_CA_PIN: ${DUMBMONIT_AGENT_CA_PIN:-}
      # The name shown in DumbMonit (a container's own hostname is random).
      DUMBMONIT_AGENT_HOSTNAME: ${DUMBMONIT_AGENT_HOSTNAME:-}
      # true = also run the probes of the devices assigned to this agent.
      DUMBMONIT_AGENT_RELAY: ${DUMBMONIT_AGENT_RELAY:-false}
      DUMBMONIT_AGENT_SITE: ${DUMBMONIT_AGENT_SITE:-}
      DUMBMONIT_AGENT_SECRET_FILE: /var/lib/dumbmonit-agent/agent-secret
      # A relay's gateway listens on 8443 by default (the port set in DumbMonit
      # wins); this forces another address, for example 0.0.0.0:9443. Publish
      # the same port below.
      DUMBMONIT_AGENT_GATEWAY_LISTEN: ${DUMBMONIT_AGENT_GATEWAY_LISTEN:-}
    ports:
      # Relay gateway: the agents of the site connect here, and the relay
      # carries their encrypted channel to the server. A relay opens it as soon
      # as it connects; an ordinary agent never listens, so the published port
      # just refuses connections. Restrict it to the site's network, either
      # with the host firewall or by publishing on the LAN address only
      # (DUMBMONIT_AGENT_GATEWAY_PUBLISH=192.168.10.5:8443). On a host where 8443
      # is already taken (the DumbMonit server itself), keep it off the network:
      # DUMBMONIT_AGENT_GATEWAY_PUBLISH=127.0.0.1:18443.
      - "${DUMBMONIT_AGENT_GATEWAY_PUBLISH:-8443}:8443"
    volumes:
      # Keeps the agent bound to its device when the container is recreated.
      - agent-state:/var/lib/dumbmonit-agent
      # Containers of this host. Remove to keep the agent off the Docker API.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Lets relayed ping monitors work without any capability.
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"
    restart: unless-stopped

volumes:
  agent-state:
