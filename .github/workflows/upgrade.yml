name: Upgrade test

# Starts the last published release, fills it with real data (monitors of
# several kinds, an encrypted secret, rules, silences, status page, teams,
# settings, a simulated agent, metric history), then starts the image built from
# this commit on the same /data volume and checks that everything survived
# (scripts/upgrade-test.sh, details in docs/development.md). A second run starts
# from the last release of the previous minor version; it is reported but does
# not fail the job (the project defines no oldest supported version).
#
# Also the "does the Dockerfile still build" check: both images (server and
# agent) are built here on every push to dev and main. A pull request into dev
# or main builds the server image only, and only when something that ends up in
# it changed (see `paths`), so that a docs or web-only PR does not pay for it.
#
# Not a required check of the PRs, but a release gate: release.yml refuses to
# publish a tag whose commit has no green run of this workflow on main.
#
# On main it also keeps the BuildKit cache warm for the release: a tag can only
# read the caches of main (the default branch) and its own, and this build uses
# the very same inputs as release.yml (commit, commit date), so the tag build
# finds every layer, the server and the four agents included, already built.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "profiles/**"
      - "integrations/**"
      - "scripts/upgrade-test.sh"
      - "scripts/upgrade-test/**"
      - ".github/workflows/upgrade.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade:
    name: Upgrade from the last release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # The image build of the whole workspace now fills the runner's disk ("No space left on device").
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same build arguments as release.yml: same cache keys.
      - name: Commit date
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      # More swap: a memory peak of the build then slows down instead of killing the runner.
      - name: Swap
        run: |
          sudo swapoff -a && sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 10G /swapfile && sudo chmod 600 /swapfile
          sudo mkswap /swapfile >/dev/null && sudo swapon /swapfile && free -h
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # One cache scope per image: two builds exporting to the same scope
      # overwrite each other's index. On dev release.yml writes the cache, here
      # it is only read; on main this is the only image build, it writes it.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: dumbmonit-candidate:ci
          # The agents (four targets, fat LTO) build beside the server on a 16 GB runner:
          # unbridled, the two together ran it out of memory and the runner was shut down.
          build-args: |
            DUMBMONIT_BUILD=${{ github.sha }}
            CARGO_BUILD_JOBS=2
          cache-from: |
            type=gha,scope=server
            type=gha,scope=agent
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=server,mode=max,ignore-error=true' || '' }}
      # The agent image (ghcr.io/selfhostr/dumbmonit-agent) is a second target of
      # the same Dockerfile; it reuses the layers just built.
      - if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: agent-image
          platforms: linux/amd64
          push: false
          cache-from: |
            type=gha,scope=agent
            type=gha,scope=server
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=agent,mode=max,ignore-error=true' || '' }}
      # Two independent runs side by side (own containers, volumes, network and
      # mock service): the last release, which gates, and the last release of the
      # previous minor version, which only warns. Each one writes its logs and a
      # summary under RUNNER_TEMP; they are printed here once both are done, and
      # uploaded as an artifact when the job fails.
      - name: Upgrade test (releases -> this commit)
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -u
          out="$RUNNER_TEMP/upgrade"
          mkdir -p "$out"
          for baseline in latest previous-minor; do
            OLD_IMAGE=$baseline \
              UPGRADE_LOG_DIR="$out/logs-$baseline" \
              UPGRADE_SUMMARY_FILE="$out/summary-$baseline.md" \
              scripts/upgrade-test.sh dumbmonit-candidate:ci >"$out/$baseline.out" 2>&1 &
            echo "$!" >"$out/$baseline.pid"
          done
          status=0
          for baseline in latest previous-minor; do
            rc=0
            wait "$(cat "$out/$baseline.pid")" || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "::group::Upgrade test from $baseline: passed"
              cat "$out/$baseline.out"
              echo "::endgroup::"
            elif [ "$baseline" = latest ]; then
              echo "::error::Upgrade test from the latest release failed (exit $rc), logs below"
              cat "$out/$baseline.out"
              status=1
            else
              echo "::warning::Upgrade test from the previous minor release failed (exit $rc): reported, not blocking"
              cat "$out/$baseline.out"
            fi
            if [ -f "$out/summary-$baseline.md" ]; then
              cat "$out/summary-$baseline.md" >>"$GITHUB_STEP_SUMMARY"
            fi
          done
          exit "$status"
      - name: Upgrade test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upgrade-test-logs
          path: ${{ runner.temp }}/upgrade
          if-no-files-found: ignore
          retention-days: 7
