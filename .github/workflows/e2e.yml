name: E2E journeys

# Drives the real image in a real browser (web/e2e): first-run setup, adding an
# HTTP monitor, a webhook channel, an outage and its recovery, the public status
# page, the wall, sign-out and sign-in. Desktop and a 390 px phone run as two
# parallel jobs, each on its own container and an empty volume.
#
# The image is built here (read-only BuildKit cache shared with upgrade.yml and
# release.yml, which are the ones that write it).
on:
  push:
    branches: [main, dev]
  pull_request:
    paths:
      - "web/**"
      - "crates/**"
      - "profiles/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    steps:
      # The image build of the whole workspace fills the runner's disk.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Commit date
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: dumbmonit-e2e:ci
          build-args: DUMBMONIT_BUILD=${{ github.sha }}
          cache-from: |
            type=gha,scope=server
            type=gha,scope=agent
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the dependencies and Chromium
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Journeys
        working-directory: web
        env:
          E2E_IMAGE: dumbmonit-e2e:ci
        run: npx playwright test --config e2e/playwright.config.ts --project=${{ matrix.project }}
      # Screenshots, traces, the HTML report and the server log of the run.
      - name: Keep the evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-${{ matrix.project }}
          path: |
            web/test-results
            web/playwright-report
          retention-days: 7
          if-no-files-found: ignore
      # A run killed before its teardown must not leave a container on the runner's log.
      - name: Server logs of leftover containers
        if: failure()
        run: |
          for id in $(docker ps -aq --filter label=dumbmonit-e2e=1); do
            echo "::group::$id"; docker logs --tail 200 "$id" 2>&1 || true; echo "::endgroup::"
          done
