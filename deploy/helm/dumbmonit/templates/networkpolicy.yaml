{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dumbmonit.fullname" . }}
  labels:
    {{- include "dumbmonit.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dumbmonit.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if not .Values.networkPolicy.allowAllEgress }}
    - Egress
    {{- end }}
  ingress:
    - ports:
        - port: https
          protocol: TCP
      {{- with .Values.networkPolicy.uiFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if .Values.agentService.enabled }}
    - ports:
        - port: agents
          protocol: TCP
      {{- with .Values.networkPolicy.agentFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
  {{- if not .Values.networkPolicy.allowAllEgress }}
  egress: []
  {{- end }}
{{- end }}
