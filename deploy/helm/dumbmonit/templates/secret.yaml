{{- if and .Values.secret.value (not .Values.secret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dumbmonit.fullname" . }}
  labels:
    {{- include "dumbmonit.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secret.existingSecretKey }}: {{ .Values.secret.value | quote }}
{{- end }}
