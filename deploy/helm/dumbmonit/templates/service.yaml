apiVersion: v1
kind: Service
metadata:
  name: {{ include "dumbmonit.fullname" . }}
  labels:
    {{- include "dumbmonit.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: https
      port: {{ .Values.service.port }}
      targetPort: https
      protocol: TCP
  selector:
    {{- include "dumbmonit.selectorLabels" . | nindent 4 }}
{{- if .Values.agentService.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dumbmonit.fullname" . }}-agents
  labels:
    {{- include "dumbmonit.labels" . | nindent 4 }}
  {{- with .Values.agentService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.agentService.type }}
  {{- if and (eq .Values.agentService.type "LoadBalancer") .Values.agentService.loadBalancerIP }}
  loadBalancerIP: {{ .Values.agentService.loadBalancerIP }}
  {{- end }}
  {{- if and (eq .Values.agentService.type "LoadBalancer") .Values.agentService.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml .Values.agentService.loadBalancerSourceRanges | nindent 4 }}
  {{- end }}
  {{- if and (ne .Values.agentService.type "ClusterIP") .Values.agentService.externalTrafficPolicy }}
  externalTrafficPolicy: {{ .Values.agentService.externalTrafficPolicy }}
  {{- end }}
  ports:
    - name: agents
      port: {{ .Values.agentService.port }}
      targetPort: agents
      protocol: TCP
      {{- if and (eq .Values.agentService.type "NodePort") .Values.agentService.nodePort }}
      nodePort: {{ .Values.agentService.nodePort }}
      {{- end }}
  selector:
    {{- include "dumbmonit.selectorLabels" . | nindent 4 }}
{{- end }}
